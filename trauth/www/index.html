<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T.R.A.U.T.H.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* theme triplets (set by JS per profile) */
    --c:63,208,255; --hi:191,243,255; --mid:26,156,240; --deep:12,70,150;
    --bg:#020814;
    --cyan:rgb(var(--c)); --cyan-hi:rgb(var(--hi)); --cyan-dim:rgba(var(--c),.35);
    --line:rgba(var(--c),.2); --text:#dceffa; --muted:#86a6bd;
    --warn:#ffb547; --ok:#5dffb0; --bad:#ff5d73;
    --panel:rgba(6,18,36,.86);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Rajdhani',system-ui,sans-serif;overflow:hidden}
  body{background:radial-gradient(ellipse at 50% 45%, rgba(var(--deep),.38), transparent 60%),radial-gradient(ellipse at 50% 120%, rgba(var(--deep),.4), transparent 60%),var(--bg);transition:background .6s}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;
    mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%)}
  button,input,select{font-family:inherit;color:inherit}

  /* ---------- Header ---------- */
  header{position:fixed;top:0;left:0;right:0;padding:calc(14px + var(--safe-t)) 22px 10px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}
  .brand{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.28em;font-size:17px;color:var(--cyan-hi);text-shadow:0 0 12px var(--cyan)}
  .brand small{display:block;font-family:'Rajdhani';letter-spacing:.16em;font-size:11px;color:var(--muted);font-weight:500;margin-top:4px;max-width:46vw;line-height:1.35}
  .clock{text-align:right}
  .clock .t{font-family:'Orbitron';font-size:26px;color:var(--cyan-hi);text-shadow:0 0 14px var(--cyan)}
  .clock .d{font-size:13px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
  .hud-btns{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;pointer-events:auto;align-items:center}
  .icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--cyan-dim);background:rgba(var(--deep),.45);display:grid;place-items:center;cursor:pointer;flex:none}
  .icon-btn svg{width:16px;height:16px;stroke:var(--cyan-hi)}
  .who-chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 4px;border-radius:999px;border:1px solid var(--cyan-dim);background:rgba(var(--deep),.45);cursor:pointer;font-weight:600;letter-spacing:.1em;font-size:13px;text-transform:uppercase}
  .mini-av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:'Orbitron';font-size:12px;color:#021;
    background:radial-gradient(circle at 40% 35%, #fff, rgb(var(--hi)) 30%, rgb(var(--c)) 60%, rgb(var(--mid)));box-shadow:0 0 10px rgba(var(--c),.8)}

  /* ---------- Stage ---------- */
  #stage{position:fixed;inset:0}
  #links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #links line{stroke:var(--cyan);stroke-opacity:.18;stroke-width:1;stroke-dasharray:3 6;animation:flow 6s linear infinite}
  #links line.hot{stroke-opacity:.75;stroke-width:1.5}
  @keyframes flow{to{stroke-dashoffset:-90}}
  .core-wrap{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;cursor:pointer}
  .ring{position:absolute;border-radius:50%;pointer-events:none}
  .ring svg{width:100%;height:100%;overflow:visible}
  .r1{animation:spin 40s linear infinite}.r2{animation:spin 26s linear infinite reverse}.r3{animation:spin 70s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .core{border-radius:50%;position:relative;
    background:radial-gradient(circle at 50% 50%, #fff 0%, rgb(var(--hi)) 9%, rgb(var(--c)) 22%, rgb(var(--mid)) 42%, rgba(var(--deep),.75) 62%, rgba(var(--deep),.2) 74%, transparent 76%);
    box-shadow:0 0 50px rgba(var(--c),.8),0 0 120px rgba(var(--mid),.45),inset 0 0 40px rgba(255,255,255,.35);animation:breathe 4.5s ease-in-out infinite}
  .core::after{content:"";position:absolute;inset:12%;border-radius:50%;
    background:conic-gradient(from 0deg, transparent, rgba(255,255,255,.35), transparent 30%, rgba(var(--hi),.25), transparent 65%);animation:spin 6s linear infinite;mix-blend-mode:screen;filter:blur(2px)}
  .core-label{position:absolute;font-family:'Orbitron';font-weight:900;letter-spacing:.2em;font-size:11px;color:rgba(2,16,30,.55);pointer-events:none}
  @keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.04);filter:brightness(1.15)}}
  .core-wrap.speaking .core{animation:talk .35s ease-in-out infinite alternate}
  @keyframes talk{from{transform:scale(1);filter:brightness(1.1)}to{transform:scale(1.08);filter:brightness(1.45)}}
  .status{position:absolute;transform:translateX(-50%);text-align:center;pointer-events:none;width:90vw;max-width:540px}
  .status .greet{font-family:'Orbitron';font-size:13px;letter-spacing:.3em;color:var(--cyan-hi);text-transform:uppercase}
  .status .line{font-size:13px;letter-spacing:.18em;color:var(--muted);margin-top:6px;text-transform:uppercase}
  .status .line b{color:var(--ok);font-weight:600}

  .sat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:none;background:none;padding:0;animation:float 6s ease-in-out infinite;transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1);touch-action:none;user-select:none;-webkit-user-select:none}
  .sat.dragging{transition:none;z-index:4;animation:none;cursor:grabbing}
  .sat.dragging .ball{transform:scale(1.25);border-color:#fff;box-shadow:0 0 40px rgba(var(--c),.9), inset 0 0 22px rgba(var(--hi),.5)}
  .sat .ball{width:var(--sat);height:var(--sat);border-radius:50%;display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 35% 30%, rgba(var(--c),.32), rgba(var(--deep),.55) 55%, rgba(3,12,26,.9));
    border:1px solid rgba(var(--c),.55);box-shadow:0 0 18px rgba(var(--c),.35), inset 0 0 18px rgba(var(--c),.25);transition:transform .25s, box-shadow .25s, border-color .25s}
  .sat .ball svg{width:42%;height:42%;stroke:var(--cyan-hi);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--cyan))}
  .sat:hover .ball,.sat:focus-visible .ball,.sat.active .ball{transform:scale(1.12);border-color:var(--cyan-hi);box-shadow:0 0 30px rgba(var(--c),.75), inset 0 0 22px rgba(var(--hi),.45)}
  .sat .lbl{font-family:'Orbitron';font-size:10.5px;letter-spacing:.22em;color:var(--cyan-hi);text-transform:uppercase}
  .sat .val{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:-4px}
  .sat .lockdot{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#0a1a30;border:1px solid var(--warn);display:grid;place-items:center}
  .sat .lockdot svg{width:9px;height:9px;stroke:var(--warn);filter:none}
  @keyframes float{0%,100%{margin-top:0}50%{margin-top:-6px}}

  /* ---------- Profile picker ---------- */
  #picker{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:radial-gradient(ellipse at center, rgba(10,30,60,.92), rgba(1,5,12,.98));backdrop-filter:blur(8px);transition:opacity .5s}
  #picker.hide{opacity:0;pointer-events:none}
  #picker .ptitle{font-family:'Orbitron';font-weight:900;letter-spacing:.4em;font-size:clamp(22px,5vw,34px);color:#e9f8ff;text-shadow:0 0 20px rgba(120,200,255,.8);text-align:center;padding-left:.4em}
  #picker .psub{font-size:12px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;text-align:center;margin-top:10px;padding:0 20px}
  #picker .ask{font-family:'Orbitron';font-size:12px;letter-spacing:.35em;color:#9cc;text-transform:uppercase}
  .avatars{display:flex;gap:clamp(30px,8vw,80px)}
  .av{display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;background:none;border:none}
  .av .orb{width:clamp(96px,22vw,130px);height:clamp(96px,22vw,130px);border-radius:50%;display:grid;place-items:center;font-family:'Orbitron';font-weight:900;font-size:clamp(30px,7vw,42px);color:rgba(2,16,30,.7);
    background:radial-gradient(circle, #fff 0%, rgb(var(--hi)) 14%, rgb(var(--c)) 34%, rgb(var(--mid)) 55%, rgba(var(--deep),.6) 72%, transparent 74%);
    box-shadow:0 0 40px rgba(var(--c),.7),0 0 90px rgba(var(--mid),.35);animation:breathe 4.5s ease-in-out infinite;transition:transform .25s}
  .av:hover .orb{transform:scale(1.08)}
  .av .nm{font-family:'Orbitron';letter-spacing:.3em;font-size:14px;color:rgb(var(--hi));text-transform:uppercase;padding-left:.3em}

  /* ---------- Panel ---------- */
  #scrim{position:fixed;inset:0;background:rgba(1,6,16,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
  #scrim.show{opacity:1;pointer-events:auto}
  #panel{position:fixed;z-index:10;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-left:1px solid var(--cyan-dim);box-shadow:-20px 0 60px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:var(--safe-t)}
  #panel.open{transform:none}
  @media (max-width:700px){#panel{top:auto;left:0;width:100%;height:84vh;border-left:none;border-top:1px solid var(--cyan-dim);border-radius:22px 22px 0 0;transform:translateY(105%);padding-top:0}}
  .p-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
  .p-head h2{margin:0;font-family:'Orbitron';font-size:15px;letter-spacing:.3em;color:var(--cyan-hi);text-transform:uppercase;text-shadow:0 0 10px var(--cyan)}
  .p-head .sub{font-size:12px;color:var(--muted);letter-spacing:.12em;margin-top:4px;text-transform:uppercase}
  .p-body{flex:1;overflow:auto;padding:18px 22px calc(28px + var(--safe-b))}
  .note{font-size:12.5px;color:var(--muted);border:1px dashed var(--cyan-dim);border-radius:10px;padding:9px 12px;margin-bottom:16px;letter-spacing:.03em}
  .note b{color:var(--warn);font-weight:600}
  h3{font-family:'Orbitron';font-size:11px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin:22px 0 10px;font-weight:500}
  .card{border:1px solid var(--line);background:rgba(var(--deep),.3);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .row .name{font-size:16px;font-weight:600;letter-spacing:.03em}
  .row .meta,.meta{font-size:12.5px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--cyan-dim);background:rgba(var(--deep),.4);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;letter-spacing:.06em;cursor:pointer;transition:all .2s}
  .chip:hover,.chip.on{border-color:var(--cyan-hi);background:rgba(var(--c),.18);box-shadow:0 0 14px rgba(var(--c),.35)}
  .tog{width:50px;height:28px;border-radius:999px;border:1px solid var(--cyan-dim);background:rgba(3,12,26,.8);position:relative;cursor:pointer;flex:none;transition:all .25s}
  .tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#456;transition:all .25s}
  .tog.on{background:rgba(var(--c),.25);border-color:var(--cyan-hi)}
  .tog.on::after{left:25px;background:var(--cyan-hi);box-shadow:0 0 10px var(--cyan)}
  input[type=range]{width:100%;accent-color:var(--cyan);margin-top:10px}
  .field{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--cyan-dim);background:rgba(3,12,26,.7);font-size:16px;font-weight:600;letter-spacing:.05em;outline:none}
  .field:focus{border-color:var(--cyan-hi);box-shadow:0 0 12px rgba(var(--c),.35)}
  select.field{appearance:none;-webkit-appearance:none;font-size:14px}
  select.field option{background:#061224}
  .sm-btn{padding:9px 16px;border-radius:999px;border:1px solid var(--cyan-hi);background:rgba(var(--c),.15);font-weight:700;letter-spacing:.12em;font-size:12.5px;cursor:pointer;text-transform:uppercase;white-space:nowrap}
  .sm-btn:active{transform:scale(.97)}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:4px 0}
  .sw i{width:44px;height:44px;border-radius:50%;display:block;border:2px solid transparent;transition:all .2s;
    background:radial-gradient(circle, #fff 0%, rgb(var(--hi)) 18%, rgb(var(--c)) 42%, rgb(var(--mid)) 64%, rgb(var(--deep)) 100%);box-shadow:0 0 14px rgba(var(--c),.55)}
  .sw span{font-size:11.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .sw.on i{border-color:#fff;transform:scale(1.1);box-shadow:0 0 22px rgba(var(--c),.9)}
  .sw.on span{color:#fff}
  .slabel{display:flex;justify-content:space-between;font-size:14px;font-weight:600;letter-spacing:.04em;margin-top:12px}
  .slabel span:last-child{color:var(--muted);font-weight:500}

  /* climate */
  .dial{width:220px;height:220px;margin:6px auto 4px;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle, rgba(var(--c),.12), transparent 65%);border:1px solid var(--cyan-dim);box-shadow:0 0 40px rgba(var(--c),.2), inset 0 0 30px rgba(var(--c),.15)}
  .dial .set{font-family:'Orbitron';font-size:56px;color:var(--cyan-hi);text-shadow:0 0 18px var(--cyan);line-height:1}
  .dial .set sup{font-size:22px}
  .dial .cap{font-size:12px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;text-align:center;margin-top:6px}
  .dial-ctrl{display:flex;justify-content:center;gap:40px;margin:8px 0 6px}
  .round{width:54px;height:54px;border-radius:50%;border:1px solid var(--cyan-dim);background:rgba(var(--deep),.5);font-size:26px;cursor:pointer;color:var(--cyan-hi)}
  .round:active{transform:scale(.94)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .stat{text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 4px}
  .stat .v{font-family:'Orbitron';font-size:18px;color:var(--cyan-hi)}
  .stat .k{font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-top:3px}
  /* cameras */
  .cams{display:grid;gap:10px}
  .cam{aspect-ratio:16/9;border-radius:14px;border:1px solid var(--cyan-dim);position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(var(--deep),.5),#030b18)}
  .cam::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(var(--c),.06) 0 2px, transparent 2px 4px)}
  .cam .tag{position:absolute;top:10px;left:12px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:600}
  .cam .src{position:absolute;top:10px;right:12px;font-size:11px;color:var(--muted);letter-spacing:.12em}
  .cam .mid{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:0 20px}
  .live{color:var(--bad)} .live::before{content:"●  "}
  /* garage */
  .garage{width:200px;height:170px;margin:50px auto 14px;border:2px solid var(--cyan-dim);border-top-width:0;position:relative;border-radius:0 0 6px 6px}
  .garage::before{content:"";position:absolute;left:-14px;right:-14px;top:-40px;height:40px;background:rgba(var(--c),.25);clip-path:polygon(0 100%,50% 0,100% 100%,97% 100%,50% 6%,3% 100%)}
  .gdoor{position:absolute;left:12px;right:12px;bottom:0;background:repeating-linear-gradient(0deg, rgba(var(--c),.25) 0 2px, rgba(var(--deep),.6) 2px 24px);border:1px solid var(--cyan);transition:height 1.6s ease;box-shadow:0 0 20px rgba(var(--c),.3)}
  .big-btn{display:block;width:100%;padding:16px;border-radius:14px;border:1px solid var(--cyan-hi);background:rgba(var(--c),.15);font-family:'Orbitron';letter-spacing:.25em;font-size:14px;color:var(--cyan-hi);cursor:pointer;text-transform:uppercase;box-shadow:0 0 18px rgba(var(--c),.3)}
  .big-btn:active{transform:scale(.98)}
  .big-btn.ghost{border-color:var(--cyan-dim);box-shadow:none;background:none;font-size:12px}
  /* tv */
  .remote{max-width:260px;margin:4px auto}
  .remote .top{display:flex;justify-content:space-between;margin-bottom:16px}
  .dpad{width:200px;height:200px;margin:0 auto 16px;position:relative;border-radius:50%;border:1px solid var(--cyan-dim);background:rgba(var(--deep),.35)}
  .dpad button{position:absolute;width:56px;height:56px;border:none;background:none;font-size:22px;cursor:pointer;color:var(--cyan-hi)}
  .dpad .u{top:4px;left:72px}.dpad .d{bottom:4px;left:72px}.dpad .l{left:4px;top:72px}.dpad .r{right:4px;top:72px}
  .dpad .ok{top:62px;left:62px;width:76px;height:76px;border-radius:50%;border:1px solid var(--cyan);background:rgba(var(--c),.15);font-family:'Orbitron';font-size:13px;letter-spacing:.15em}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .rbtn{padding:12px 0;border-radius:12px;border:1px solid var(--cyan-dim);background:rgba(var(--deep),.4);cursor:pointer;font-weight:600;letter-spacing:.1em;font-size:13px}
  .rbtn:active,.dpad button:active{background:rgba(var(--c),.25)}
  /* lists */
  .day{font-family:'Orbitron';font-size:11px;letter-spacing:.2em;color:var(--cyan);margin:16px 0 8px;text-transform:uppercase}
  .evt{display:flex;gap:12px;align-items:center;padding:10px 12px;border-left:2px solid var(--cyan);background:rgba(var(--deep),.3);border-radius:0 10px 10px 0;margin-bottom:8px}
  .evt .time{font-family:'Orbitron';font-size:12px;color:var(--cyan-hi);min-width:62px}
  .evt .who{margin-left:auto;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .task{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .task .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--cyan);flex:none;display:grid;place-items:center}
  .task.done .box{background:var(--cyan)} .task.done .box::after{content:"✓";color:#021;font-size:13px;font-weight:700}
  .task.done .tname{text-decoration:line-through;opacity:.55}
  .due{margin-left:auto;font-size:12px;letter-spacing:.06em;white-space:nowrap}
  .due.late{color:var(--bad)} .due.soon{color:var(--warn)} .due.ok{color:var(--muted)}
  .kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
  .kv span:nth-child(odd){color:var(--muted)}
  /* finance */
  .pin-dots{display:flex;justify-content:center;gap:16px;margin:24px 0 26px}
  .pin-dots i{width:15px;height:15px;border-radius:50%;border:1px solid var(--cyan);display:block;transition:all .15s}
  .pin-dots i.f{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .pin-dots.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
  .key{width:72px;height:72px;border-radius:50%;border:1px solid var(--cyan-dim);background:rgba(var(--deep),.4);font-family:'Orbitron';font-size:22px;cursor:pointer;color:var(--cyan-hi)}
  .key:active{background:rgba(var(--c),.3)}
  .key.ghost{border:none;background:none;font-size:13px;font-family:'Rajdhani';letter-spacing:.1em}
  .lockmsg{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .bal .stat .v{font-size:15px}
  .bars{display:grid;gap:9px}
  .bar{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:10px;font-size:13.5px}
  .bar .track{height:8px;border-radius:9px;background:rgba(var(--c),.1);overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,rgb(var(--mid)),var(--cyan-hi));box-shadow:0 0 8px var(--cyan)}

function ringSVG(r,dash,ticks){
  let s=`<svg viewBox="-100 -100 200 200"><circle r="${r}" fill="none" style="stroke:rgba(var(--c),.45)" stroke-width="0.6" stroke-dasharray="${dash}"/>`;
  if(ticks){for(let a=0;a<360;a+=360/ticks){const q=a*Math.PI/180;s+=`<line x1="${Math.cos(q)*(r-3)}" y1="${Math.sin(q)*(r-3)}" x2="${Math.cos(q)*(r+3)}" y2="${Math.sin(q)*(r+3)}" style="stroke:rgba(var(--hi),.7)" stroke-width="0.8"/>`}}
  return s+"</svg>";
}

function visibleModules(){if(!me)return modules;return me.order.filter(id=>!me.hidden.includes(id)).map(id=>modules.find(m=>m.id===id)).filter(Boolean)}
function buildSats(){
  satEls.forEach(e=>e.remove());satEls=[];

    b.innerHTML=`<div class="ball">${m.icon}${m.locked?`<span class="lockdot">${I.lock}</span>`:""}</div><div class="lbl">${m.label}</div><div class="val"></div>`;

    b.addEventListener("pointerdown",e=>startDrag(e,b));
    stage.appendChild(b);satEls.push(b);
  });

let geo={cx:0,cy:0},dragEl=null,justDragged=false;
function layout(){
  const W=innerWidth,H=innerHeight,mobile=W<700;
  const cx=W/2,cy=H*(mobile?.5:.52);
  const R=Math.min(W*(mobile?.38:.32),H*.30),yk=mobile?1.05:.92;
  const core=Math.max(90,Math.min(R*.62,190)),sat=Math.max(54,Math.min(R*.30,84));
  document.documentElement.style.setProperty("--sat",sat+"px");
  Object.assign(coreWrap.style,{left:cx+"px",top:cy+"px",width:core*1.9+"px",height:core*1.9+"px"});
  const c=document.getElementById("core");c.style.width=c.style.height=core+"px";
  [["r1",1.35],["r2",1.6],["r3",1.9]].forEach(([id,k])=>{const e=document.getElementById(id);e.style.width=e.style.height=core*k+"px"});
  const st=document.getElementById("status");st.style.left=cx+"px";st.style.top=Math.min(cy+R*yk+sat*.5+56,H-62)+"px";
  links.setAttribute("viewBox",`0 0 ${W} ${H}`);
  geo={cx,cy};const n=satEls.length;let ls="";
  satEls.forEach((el,i)=>{
    const a=-Math.PI/2+i*(2*Math.PI/n),x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R*yk;
    if(el!==dragEl){el.style.left=x+"px";el.style.top=y+"px"}
    ls+=`<line data-id="${el.dataset.id}" x1="${cx+Math.cos(a)*core*.95}" y1="${cy+Math.sin(a)*core*.95}" x2="${x-Math.cos(a)*sat*.55}" y2="${y-Math.sin(a)*sat*.55}"/>`;
  });
  links.innerHTML=ls;
}

/* ---------- Drag to rearrange orbs ---------- */
function startDrag(e,el){
  if(e.button!==undefined&&e.button!==0)return;
  const sx=e.clientX,sy=e.clientY;let active=false;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  const move=ev=>{
    if(!active){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;active=true;dragEl=el;el.classList.add("dragging");chime(520)}
    el.style.left=ev.clientX+"px";el.style.top=ev.clientY+"px";
    const n=satEls.length,step=2*Math.PI/n;
    let a=Math.atan2(ev.clientY-geo.cy,ev.clientX-geo.cx)+Math.PI/2;if(a<0)a+=2*Math.PI;
    const target=Math.round(a/step)%n,cur=satEls.indexOf(el);
    if(target!==cur){satEls.splice(cur,1);satEls.splice(target,0,el);layout();chime(740)}
  };
  const up=()=>{
    el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);
    if(!active)return;
    justDragged=true;setTimeout(()=>justDragged=false,350);
    el.classList.remove("dragging");dragEl=null;
    const vis=satEls.map(x=>x.dataset.id);me.order=[...vis,...me.order.filter(id=>!vis.includes(id))];save();
    layout();chime(990);say("drag");
  };
  el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}

  apple:{up:"up",down:"down",left:"left",right:"right",ok:"select",back:"menu",home:"home"},
  android:{up:"DPAD_UP",down:"DPAD_DOWN",left:"DPAD_LEFT",right:"DPAD_RIGHT",ok:"DPAD_CENTER",back:"BACK",home:"HOME"},

let calCache=null;
async function loadCalendar(){
  const cs=calendars();if(!cs.length||DEMO)return;
  const start=new Date(),end=new Date(Date.now()+7*864e5);
  const out=[];
  await Promise.all(cs.map(async c=>{try{
    const r=await fetch(`${API}ha/calendars/${c.entity_id}?start=${start.toISOString()}&end=${end.toISOString()}`);
    if(r.ok)(await r.json()).forEach(ev=>out.push({...ev,cal:nm(c)}));
  }catch(e){}}));
  out.sort((a,b)=>String(a.start.dateTime||a.start.date).localeCompare(String(b.start.dateTime||b.start.date)));
  calCache=out;if(current==="calendar")render();
}

/* ---------- Panel interactions ---------- */
let tempTimer=null;
function queueTemp(c,payload,label){clearTimeout(tempTimer);tempTimer=setTimeout(()=>{call("climate","set_temperature",{entity_id:c.entity_id,...payload});say("temp",{set:label})},900)}
pBody.addEventListener("click",async e=>{
  const t=e.target.closest("button,.task");if(!t)return;const d=t.dataset;
  /* settings */
  if(d.theme){me.theme=d.theme;applyTheme(me.theme);save();chime(990);render();say("theme",{theme:THEMES[d.theme].name});return}
  if(d.engine){me.voice.engine=d.engine;save();chime(900);render();say("newvoice",{},true);return}
  if(d.style){me.style=d.style;save();chime(900);render();say("style");return}
  if(d.set==="voice"){me.voice.on=!me.voice.on;save();chime(800);render();say(me.voice.on?"voice_on":"voice_off",{},true);return}
  if(d.set==="sfx"){me.sfx.on=!me.sfx.on;save();chime(800,true);render();say(me.sfx.on?"sfx_on":"sfx_off");return}
  if(d.orb){const lbl=modules.find(m=>m.id===d.orb).label,i=me.hidden.indexOf(d.orb);if(i>=0){me.hidden.splice(i,1);say("orb_show",{orb:lbl})}else{if(MODULE_IDS.length-me.hidden.length<=2){toast("Keep at least 2 orbs");return}me.hidden.push(d.orb);say("orb_hide",{orb:lbl})}save();buildSats();chime(760);render();return}
  if(d.act==="testVoice"){say("test",{},true);return}
  if(d.act==="resetOrder"){me.order=[...MODULE_IDS];save();buildSats();chime(990);render();say("order_reset");return}
  if(d.act==="savePin"){const v=document.getElementById("sPin").value.trim();if(!/^\d{4}$/.test(v)){toast("PIN must be 4 digits");say("pin_invalid");return}me.pin=v;save();chime(1100);toast("Passcode updated");render();say("pin_saved");return}
  if(d.act==="checkUpdate"){if(DEMO){toast("Demo mode");return}toast("Checking for updates…");
    try{const r=await (await fetch(API+"update",{method:"POST"})).json();if(r.updated){toast("Updated! Reloading…");setTimeout(()=>location.reload(),900)}else toast("You're on the newest version")}catch(e){toast("Couldn't check for updates")}return}
  if(d.act==="switch"){say("switch");showPicker();return}
  if(d.ignore){const L=appData.ignored||(appData.ignored=[]);const i=L.indexOf(d.ignore);if(i>=0)L.splice(i,1);else L.push(d.ignore);persist();chime(800);render();refresh();return}
  /* house */
  if(d.act==="addTask"){const v=document.getElementById("newTask").value.trim();if(!v)return;appData.tasks.push({t:v,due:"To do",cls:"soon",done:false});persist();chime(1000);render();say("task_added");return}
  if(d.task!==undefined){const k=appData.tasks[d.task];k.done=!k.done;persist();chime(k.done?1100:600);render();say(k.done?"task_done":"task_undone");return}
  /* lights */
  if(d.toggle){const ent=HA[d.toggle];const was=ent&&ent.state==="on";chime(was?550:990);
    const ok=await call(d.toggle.split(".")[0],"toggle",{entity_id:d.toggle});
    if(ok&&d.toggle.startsWith("switch.")&&/motion_detection/.test(d.toggle))say(was?"cam_motion_off":"cam_motion_on",{cam:nm(ent).replace(/\s*(Camera )?motion detection$/i,"")});
    else if(ok)say(was?"light_off":"light_on",{room:nm(ent)});return}
  if(d.lights){const L=lightEnts();for(const l of L)await call(l.entity_id.split(".")[0],d.lights==="on"?"turn_on":"turn_off",{entity_id:l.entity_id});say(d.lights==="on"?"scene_all-on":"scene_all-off");return}
  /* climate */
  const c=climateE();
  if(d.temp&&c){const a=c.attributes;const v=Math.max(a.min_temp||50,Math.min(a.max_temp||90,(a.temperature??72)+Number(d.temp)));HA[c.entity_id].attributes.temperature=v;chime(700+v*4);render();queueTemp(c,{temperature:v},v);return}
  if((d.tlow||d.thigh)&&c){const a=c.attributes;let lo=a.target_temp_low??68,hi=a.target_temp_high??74;if(d.tlow)lo+=Number(d.tlow);if(d.thigh)hi+=Number(d.thigh);if(hi-lo<3){toast("Keep at least 3° between heat and cool");return}a.target_temp_low=lo;a.target_temp_high=hi;chime(800);render();queueTemp(c,{target_temp_low:lo,target_temp_high:hi},`${lo} to ${hi}`);return}
  if(d.mode&&c){chime(800);if(await call("climate","set_hvac_mode",{entity_id:c.entity_id,hvac_mode:d.mode}))say("mode_"+d.mode);return}
  if(d.fan&&c){chime(800);if(await call("climate","set_fan_mode",{entity_id:c.entity_id,fan_mode:d.fan}))say("fan",{fan:d.fan});return}
  /* security */
  if(d.arm){const a=mainAlarm();if(!a)return;const codeEl=document.getElementById("secCode");const p={entity_id:a.entity_id};if(codeEl&&codeEl.value)p.code=codeEl.value;chime(700);
    if(await call("alarm_control_panel",d.arm,p))say(({alarm_disarm:"sec_disarm",alarm_arm_home:"sec_arm_home",alarm_arm_away:"sec_arm_away"})[d.arm]);return}
  if(d.combo){const a=mainAlarm(),b=blinkAlarm(),codeEl=document.getElementById("secCode");const code=codeEl&&codeEl.value?{code:codeEl.value}:{};chime(700);
    const svc=d.combo==="leave"?"alarm_arm_away":"alarm_disarm";let ok=true;
    if(a)ok=await call("alarm_control_panel",svc,{entity_id:a.entity_id,...code})&&ok;
    if(b)ok=await call("alarm_control_panel",svc,{entity_id:b.entity_id})&&ok;
    if(ok){const od=openDoors().map(doorName);if(d.combo==="leave"&&od.length)sayText(line("leave")+" "+line("doors_open",{doors:listWords(od.map(x=>x.toLowerCase()))+(od.length>1?" are":" is")}));else say(d.combo==="leave"?"leave":"home_again")}return}
  if(d.alarm){chime(700);if(await call("alarm_control_panel",d.act2,{entity_id:d.alarm}))say(d.act2==="alarm_disarm"?"sec_disarm":"sec_arm_away");return}
  /* tv */
  const p=tvPlayer(),r=tvRemote();
  if(d.tvstyle){appData.tvKeys=d.tvstyle;persist();chime(800);render();return}
  if(d.key&&r){chime(900);const k=TV_KEYS[tvKeys()][d.key];call("remote","send_command",{entity_id:r.entity_id,command:k});return}
  if(d.tv==="power"&&(p||r)){chime(900);const on=tvOn();
    const ok=r?await call("remote",on?"turn_off":"turn_on",{entity_id:r.entity_id}):await call("media_player",on?"turn_off":"turn_on",{entity_id:p.entity_id});
    if(ok){say(on?"tv_off":"tv_on");if(r&&HA[r.entity_id])HA[r.entity_id]={...HA[r.entity_id],state:on?"off":"on"};render();refresh()}return}
  if(d.tv==="play"&&r&&tvKeys()==="android"){chime(900);call("remote","send_command",{entity_id:r.entity_id,command:"MEDIA_PLAY_PAUSE"});return}
  if(d.tv&&p){chime(900);
    if(d.tv==="mute")return call("media_player","volume_mute",{entity_id:p.entity_id,is_volume_muted:!p.attributes.is_volume_muted});
    if(d.tv==="vol+")return call("media_player","volume_up",{entity_id:p.entity_id});
    if(d.tv==="vol-")return call("media_player","volume_down",{entity_id:p.entity_id});
    if(d.tv==="play")return call("media_player","media_play_pause",{entity_id:p.entity_id});return}
  if(d.app){const apps=tvApps();chime(900);if(!apps)return;
    if(apps.kind==="activity")call("remote","turn_on",{entity_id:r.entity_id,activity:d.app});
    else call("media_player","select_source",{entity_id:apps.player.entity_id,source:d.app});return}
});
pBody.addEventListener("input",e=>{
  const t=e.target;lastInput=Date.now();
  if(t.dataset.range==="rate"){me.voice.rate=Number(t.value);document.getElementById("rateV").textContent=me.voice.rate.toFixed(2)+"×";save();return}
  if(t.dataset.range==="pitch"){me.voice.pitch=Number(t.value);document.getElementById("pitchV").textContent=me.voice.pitch.toFixed(2);save();return}
  if(t.dataset.range==="vol"){me.sfx.vol=Number(t.value);document.getElementById("volV").textContent=Math.round(me.sfx.vol*100)+"%";save();return}
  if(t.id==="sName"){const v=t.value.trim();if(v){me.name=v;save();refresh()}return}
  if(t.id==="houseNotes"){appData.houseNotes=t.value;persist();return}
});
pBody.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="sVoice"){me.voice.uri=t.value;save();say("newvoice",{},true)}
  if(t.id==="sPiper"){me.voice.piper=t.value;save();say("newvoice",{},true)}
  if(t.id==="sName"){sub(`${me.name}'s profile`);say("name")}
  if(t.dataset.range==="rate")say("rate",{},true);
  if(t.dataset.range==="pitch")say("pitch",{},true);
  if(t.dataset.dim){call("light","turn_on",{entity_id:t.dataset.dim,brightness_pct:Number(t.value)})}
});
pBody.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="newTask"){e.preventDefault();pBody.querySelector('[data-act="addTask"]').click()}});

let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2200)}

/* ---------- Boot ---------- */
async function boot(){
  applyTheme("arc");tick();setInterval(tick,15000);
  try{const r=await fetch(API+"ha/states",{cache:"no-store"});if(!r.ok)throw 0;const arr=await r.json();arr.forEach(s=>HA[s.entity_id]=s)}
  catch(e){DEMO=true;demoStates().forEach(s=>HA[s.entity_id]=s)}
  let saved={};
  if(DEMO){try{saved=JSON.parse(localStorage.getItem("trauth.demo")||"{}")}catch(e){}}
  else{try{saved=await (await fetch(API+"data",{cache:"no-store"})).json()}catch(e){}
       try{haUser=await (await fetch(API+"me")).json()}catch(e){}}
  if(saved.profiles&&Object.keys(saved.profiles).length)profiles=saved.profiles;
  normalizeProfiles();
  appData={tasks:Array.isArray(saved.tasks)?saved.tasks:JSON.parse(JSON.stringify(DEFAULT_TASKS)),houseNotes:saved.houseNotes||"",tvKeys:saved.tvKeys||null,
    ignored:Array.isArray(saved.ignored)?saved.ignored:Object.keys(HA).filter(id=>DEFAULT_IGNORED_RE.test(id))};
  const who=haUser&&(haUser.display||haUser.name||"").toLowerCase();
  const match=who&&Object.values(profiles).find(p=>who.startsWith(p.name.toLowerCase())||who.startsWith(p.id));
  if(match)selectProfile(match.id);else showPicker();
  refresh();
  if(!DEMO)setInterval(pull,5000);
}
boot();

</script>
